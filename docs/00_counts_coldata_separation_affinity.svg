<svg xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 640" width="1480" height="640"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1480" height="640" fill="#ffffff"/>

  <!-- TITLE BLOCK -->
  <g inkscape:label="TITLE BLOCK">
    <text x="60" y="54" font-size="28px" font-weight="700" fill="#26323C">Step 00 &#8212; why counts and colData are two files</text>
    <text x="60" y="80" font-size="16px" font-weight="500" fill="#5A6570">They come from two different downloads, have different shapes, and DESeq2 takes them as two arguments.</text>
  </g>

  <!-- SOURCE : counts download -->
  <g inkscape:label="SOURCE : counts download">
    <rect x="60" y="150" width="250" height="78" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text x="78" y="183" font-size="14.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts.tsv.gz</text>
    <text x="78" y="205" font-size="12px" font-weight="500" fill="#7A848E">NCBI reprocessed counts</text>
    <text x="78" y="221" font-size="12px" font-weight="500" fill="#7A848E">integer &#183; all 86 samples</text>
  </g>

  <!-- SOURCE : metadata download -->
  <g inkscape:label="SOURCE : metadata download">
    <rect x="60" y="412" width="250" height="78" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text x="78" y="445" font-size="14.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">series_matrix.txt.gz</text>
    <text x="78" y="467" font-size="12px" font-weight="500" fill="#7A848E">GEO GPL16791 (HiSeq)</text>
    <text x="78" y="483" font-size="12px" font-weight="500" fill="#7A848E">metadata &#183; 59 samples</text>
  </g>

  <!-- CONNECTORS source to file -->
  <g inkscape:label="CONNECTORS source to file" fill="none" stroke="#CBD3DA" stroke-width="3">
    <path d="M310,189 C 360,189 360,215 410,215"/>
    <path d="M310,451 C 360,451 360,425 410,425"/>
  </g>
  <g fill="#B7C0C8">
    <path d="M404,208 l14,7 l-14,7 z"/>
    <path d="M404,418 l14,7 l-14,7 z"/>
  </g>

  <!-- COUNTS FILE : genes x samples -->
  <g inkscape:label="COUNTS FILE : genes x samples">
    <rect x="420" y="120" width="470" height="195" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="428" y="128" width="454" height="6" rx="3" fill="#4C57C4"/>
    <text x="448" y="165" font-size="16.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts.rds</text>
    <text x="568" y="165" font-size="12.5px" font-weight="500" fill="#5A6570">genes &#215; samples</text>
    <text x="868" y="165" text-anchor="end" font-size="11px" font-weight="600" fill="#7A848E">large &#183; numeric &#183; frozen</text>
    <g font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text fill="#4C57C4" x="560" y="198" text-anchor="middle" font-size="12px" font-weight="700">S1</text>
      <text fill="#4C57C4" x="650" y="198" text-anchor="middle" font-size="12px" font-weight="700">S2</text>
      <text fill="#4C57C4" x="740" y="198" text-anchor="middle" font-size="12px" font-weight="700">S3</text>
      <text fill="#4C57C4" x="830" y="198" text-anchor="middle" font-size="12px" font-weight="700">S4</text>
      <text x="448" y="230" font-size="11px" font-weight="600" fill="#7A848E">CXCL8</text>
      <text x="560" y="230" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">42</text>
      <text x="650" y="230" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">17</text>
      <text x="740" y="230" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">88</text>
      <text x="830" y="230" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">31</text>
      <text x="448" y="258" font-size="11px" font-weight="600" fill="#7A848E">IL1B</text>
      <text x="560" y="258" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">5</text>
      <text x="650" y="258" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">120</text>
      <text x="740" y="258" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">63</text>
      <text x="830" y="258" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">9</text>
      <text x="448" y="286" font-size="11px" font-weight="600" fill="#7A848E">FOS</text>
      <text x="560" y="286" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">77</text>
      <text x="650" y="286" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">24</text>
      <text x="740" y="286" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">51</text>
      <text x="830" y="286" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">40</text>
    </g>
  </g>

  <!-- COLDATA FILE : samples x covariates -->
  <g inkscape:label="COLDATA FILE : samples x covariates">
    <rect x="420" y="355" width="470" height="210" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="428" y="363" width="454" height="6" rx="3" fill="#C9761B"/>
    <text x="448" y="400" font-size="16.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">coldata.rds</text>
    <text x="578" y="400" font-size="12.5px" font-weight="500" fill="#5A6570">samples &#215; covariates</text>
    <text x="868" y="400" text-anchor="end" font-size="11px" font-weight="600" fill="#7A848E">small &#183; mixed &#183; often edited</text>
    <g font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text fill="#C9761B" x="470" y="432" font-size="12px" font-weight="700">sample</text>
      <text fill="#C9761B" x="600" y="432" text-anchor="middle" font-size="12px" font-weight="700">condition</text>
      <text fill="#C9761B" x="720" y="432" text-anchor="middle" font-size="12px" font-weight="700">sex</text>
      <text fill="#C9761B" x="820" y="432" text-anchor="middle" font-size="12px" font-weight="700">rin</text>
      <text x="470" y="460" font-size="11px" font-weight="600" fill="#7A848E">S1</text>
      <text x="600" y="460" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">CON</text>
      <text x="720" y="460" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">M</text>
      <text x="820" y="460" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">7.2</text>
      <text x="470" y="486" font-size="11px" font-weight="600" fill="#7A848E">S2</text>
      <text x="600" y="486" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">MDD</text>
      <text x="720" y="486" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">F</text>
      <text x="820" y="486" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">6.8</text>
      <text x="470" y="512" font-size="11px" font-weight="600" fill="#7A848E">S3</text>
      <text x="600" y="512" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">CON</text>
      <text x="720" y="512" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">F</text>
      <text x="820" y="512" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">8.1</text>
      <text x="470" y="538" font-size="11px" font-weight="600" fill="#7A848E">S4</text>
      <text x="600" y="538" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">MDD</text>
      <text x="720" y="538" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">M</text>
      <text x="820" y="538" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">7.5</text>
    </g>
  </g>

  <!-- ALIGN KEY : matched + reordered by sample ID -->
  <g inkscape:label="ALIGN KEY : matched + reordered by sample ID">
    <path d="M945,215 C 1000,215 1000,335 1040,335" fill="none" stroke="#E4A24A" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M945,455 C 1000,455 1000,335 1040,335" fill="none" stroke="#E4A24A" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="915" y="312" width="52" height="24" rx="6" fill="#FDF4E3" stroke="#E4A24A" stroke-width="1.5"/>
    <text x="941" y="329" text-anchor="middle" font-size="12.5px" font-weight="700" fill="#8A6D1B" font-family="'SFMono-Regular',Menlo,Consolas,monospace">S1&#8230;S4</text>
    <text x="1055" y="312" font-size="12.5px" font-weight="700" fill="#8A6D1B">aligned by</text>
    <text x="1055" y="332" font-size="12.5px" font-weight="700" fill="#8A6D1B">sample ID</text>
    <text x="1055" y="356" font-size="11" font-weight="700" fill="#8A6D1B" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts[, rownames(coldata)]</text>
  </g>

  <!-- REJOIN CAPTION : DESeq2 -->
  <g inkscape:label="REJOIN CAPTION : DESeq2">
    <rect x="420" y="588" width="620" height="34" rx="8" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="1.5"/>
    <text x="440" y="611" font-size="14.5px" font-weight="700" fill="#2E3A44" font-family="'SFMono-Regular',Menlo,Consolas,monospace">&#8594; DESeqDataSetFromMatrix(countData=, colData=)</text>
  </g>
</svg>
