<svg xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1600" height="660" fill="#ffffff"/>

  <!-- TITLE BLOCK -->
  <g inkscape:label="TITLE BLOCK">
    <text x="60" y="52" font-size="28px" font-weight="700" fill="#26323C">Step 00 &#8212; two files, aligned by sample ID</text>
    <text x="60" y="78" font-size="16px" font-weight="500" fill="#5A6570">counts (all 86 samples, file order) and colData (59 HiSeq samples) are built separately, then line 38 subsets + reorders counts to match.</text>
  </g>

  <!-- SOURCE : counts download -->
  <g inkscape:label="SOURCE : counts download">
    <rect x="60" y="150" width="238" height="74" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text x="78" y="181" font-size="14.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts.tsv.gz</text>
    <text x="78" y="202" font-size="12px" font-weight="500" fill="#7A848E">NCBI counts &#183; integer</text>
    <text x="78" y="218" font-size="12px" font-weight="500" fill="#7A848E">all 86 samples</text>
  </g>

  <!-- SOURCE : metadata download -->
  <g inkscape:label="SOURCE : metadata download">
    <rect x="60" y="430" width="238" height="74" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text x="78" y="461" font-size="14.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">series_matrix.txt.gz</text>
    <text x="78" y="482" font-size="12px" font-weight="500" fill="#7A848E">GEO GPL16791 (HiSeq)</text>
    <text x="78" y="498" font-size="12px" font-weight="500" fill="#7A848E">59 samples</text>
  </g>

  <!-- CONNECTORS source to file -->
  <g inkscape:label="CONNECTORS source to file" fill="none" stroke="#CBD3DA" stroke-width="3">
    <path d="M298,187 C 340,187 340,210 382,210"/>
    <path d="M298,467 C 340,467 340,444 382,444"/>
  </g>
  <g fill="#B7C0C8">
    <path d="M376,203 l14,7 l-14,7 z"/>
    <path d="M376,437 l14,7 l-14,7 z"/>
  </g>

  <!-- COUNTS FILE : genes x samples (file order, extra dropped col) -->
  <g inkscape:label="COUNTS FILE : genes x samples (file order, extra dropped col">
    <rect x="392" y="118" width="500" height="200" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="400" y="126" width="484" height="6" rx="3" fill="#4C57C4"/>
    <text x="420" y="163" font-size="16.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts.rds</text>
    <text x="540" y="163" font-size="12.5px" font-weight="500" fill="#5A6570">genes &#215; samples</text>
    <text x="872" y="163" text-anchor="end" font-size="11px" font-weight="600" fill="#7A848E">86 cols &#183; file order</text>
    <g font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <!-- columns in file order, S9 is a non-HiSeq sample to be dropped -->
      <text fill="#4C57C4" x="540" y="196" text-anchor="middle" font-size="12px" font-weight="700">S3</text>
      <text fill="#4C57C4" x="620" y="196" text-anchor="middle" font-size="12px" font-weight="700">S1</text>
      <text x="700" y="196" text-anchor="middle" text-decoration="line-through" font-size="12px" font-weight="700" fill="#C0675F">S9</text>
      <text fill="#4C57C4" x="780" y="196" text-anchor="middle" font-size="12px" font-weight="700">S4</text>
      <text fill="#4C57C4" x="858" y="196" text-anchor="middle" font-size="12px" font-weight="700">S2</text>
      <text x="420" y="228" font-size="11px" font-weight="600" fill="#7A848E">CXCL8</text>
      <text x="540" y="228" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">88</text>
      <text x="620" y="228" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">42</text>
      <text x="700" y="228" text-anchor="middle" text-decoration="line-through" font-size="12px" font-weight="700" fill="#C0675F">13</text>
      <text x="780" y="228" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">31</text>
      <text x="858" y="228" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">17</text>
      <text x="420" y="256" font-size="11px" font-weight="600" fill="#7A848E">IL1B</text>
      <text x="540" y="256" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">63</text>
      <text x="620" y="256" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">5</text>
      <text x="700" y="256" text-anchor="middle" text-decoration="line-through" font-size="12px" font-weight="700" fill="#C0675F">90</text>
      <text x="780" y="256" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">9</text>
      <text x="858" y="256" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">120</text>
      <text x="420" y="284" font-size="11px" font-weight="600" fill="#7A848E">FOS</text>
      <text x="540" y="284" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">51</text>
      <text x="620" y="284" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">77</text>
      <text x="700" y="284" text-anchor="middle" text-decoration="line-through" font-size="12px" font-weight="700" fill="#C0675F">8</text>
      <text x="780" y="284" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">40</text>
      <text x="858" y="284" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">24</text>
    </g>
    <text x="700" y="306" text-anchor="middle" font-size="10.5" font-weight="700" fill="#C0675F">not in colData &#8594; dropped</text>
  </g>

  <!-- COLDATA FILE : samples x covariates (defines target order) -->
  <g inkscape:label="COLDATA FILE : samples x covariates (defines target order)">
    <rect x="392" y="360" width="500" height="212" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="400" y="368" width="484" height="6" rx="3" fill="#C9761B"/>
    <text x="420" y="405" font-size="16.5px" font-weight="700" fill="#26323C" font-family="'SFMono-Regular',Menlo,Consolas,monospace">coldata.rds</text>
    <text x="550" y="405" font-size="12.5px" font-weight="500" fill="#5A6570">samples &#215; covariates</text>
    <text x="872" y="405" text-anchor="end" font-size="11px" font-weight="600" fill="#7A848E">59 rows &#183; defines the order</text>
    <g font-family="'SFMono-Regular',Menlo,Consolas,monospace">
      <text fill="#C9761B" x="442" y="437" font-size="12px" font-weight="700">sample</text>
      <text fill="#C9761B" x="580" y="437" text-anchor="middle" font-size="12px" font-weight="700">condition</text>
      <text fill="#C9761B" x="710" y="437" text-anchor="middle" font-size="12px" font-weight="700">sex</text>
      <text fill="#C9761B" x="820" y="437" text-anchor="middle" font-size="12px" font-weight="700">rin</text>
      <text x="442" y="465" font-size="11px" font-weight="600" fill="#7A848E">S1</text>
      <text x="580" y="465" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">CON</text>
      <text x="710" y="465" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">M</text>
      <text x="820" y="465" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">7.2</text>
      <text x="442" y="491" font-size="11px" font-weight="600" fill="#7A848E">S2</text>
      <text x="580" y="491" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">MDD</text>
      <text x="710" y="491" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">F</text>
      <text x="820" y="491" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">6.8</text>
      <text x="442" y="517" font-size="11px" font-weight="600" fill="#7A848E">S3</text>
      <text x="580" y="517" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">CON</text>
      <text x="710" y="517" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">F</text>
      <text x="820" y="517" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">8.1</text>
      <text x="442" y="543" font-size="11px" font-weight="600" fill="#7A848E">S4</text>
      <text x="580" y="543" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">MDD</text>
      <text x="710" y="543" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">M</text>
      <text x="820" y="543" text-anchor="middle" font-size="11px" font-weight="600" fill="#7A848E">7.5</text>
    </g>
  </g>

  <!-- ALIGN CARD : subset + reorder -->
  <g inkscape:label="ALIGN CARD : subset + reorder">
    <!-- feed lines from both boxes into the align card -->
    <g inkscape:label="feed lines from both boxes into the align card" fill="none" stroke="#E4A24A" stroke-width="2.5" stroke-dasharray="6 6">
      <path d="M892,215 C 950,215 960,330 1010,345"/>
      <path d="M892,460 C 950,460 960,360 1010,355"/>
    </g>
    <rect x="1008" y="250" width="372" height="150" rx="14" fill="#FDF4E3" stroke="#E4A24A" stroke-width="2"/>
    <text x="1030" y="286" font-size="14.5px" font-weight="700" fill="#8A6D1B">align by sample ID</text>
    <text x="1030" y="316" font-size="13.5" font-weight="700" fill="#2E3A44" font-family="'SFMono-Regular',Menlo,Consolas,monospace">counts[, rownames(coldata)]</text>
    <text x="1030" y="348" font-size="12.5px" font-weight="600" fill="#6B5410">&#9312;  subset &#8212; drop samples not in colData (86&#8594;59)</text>
    <text x="1030" y="372" font-size="12.5px" font-weight="600" fill="#6B5410">&#9313;  reorder &#8212; columns follow colData&#8217;s row order</text>
    <text x="1030" y="393" font-size="11.5" fill="#8A7A4A" font-weight="600">now counts cols == colData rows, 1:1</text>
  </g>

  <!-- OUTPUT ARROW from align card -->
  <g inkscape:label="OUTPUT ARROW from align card">
    <line x1="1194" y1="400" x2="1194" y2="588" stroke="#CBD3DA" stroke-width="3"/>
    <path d="M1187,582 l7,14 l7,-14 z" fill="#B7C0C8"/>
  </g>

  <!-- DESeq2 CAPTION -->
  <g inkscape:label="DESeq2 CAPTION">
    <rect x="690" y="602" width="620" height="34" rx="8" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="1.5"/>
    <text x="710" y="625" font-size="14.5px" font-weight="700" fill="#2E3A44" font-family="'SFMono-Regular',Menlo,Consolas,monospace">&#8594; DESeqDataSetFromMatrix(countData=, colData=)</text>
  </g>
</svg>
