<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 640" width="1480" height="640"
     font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .figTitle{ font-size:28px;   font-weight:700; fill:#26323C; }
    .figSub  { font-size:16px;   font-weight:500; fill:#5A6570; }
    .srcTitle{ font-size:14.5px; font-weight:700; fill:#26323C; }
    .srcSub  { font-size:12px;   font-weight:500; fill:#7A848E; }
    .boxTitle{ font-size:16.5px; font-weight:700; fill:#26323C; }
    .boxSub  { font-size:12.5px; font-weight:500; fill:#5A6570; }
    .colHd   { font-size:12px;   font-weight:700; }
    .cellLbl { font-size:11px;   font-weight:600; fill:#7A848E; }
    .code    { font-size:14.5px; font-weight:700; fill:#2E3A44; font-family:'SFMono-Regular',Menlo,Consolas,monospace; }
    .join    { font-size:12.5px; font-weight:700; fill:#8A6D1B; }
    .mono    { font-family:'SFMono-Regular',Menlo,Consolas,monospace; }
  </style>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1480" height="640" fill="#ffffff"/>

  <!-- TITLE BLOCK -->
  <g>
    <text class="figTitle" x="60" y="54">Step 00 &#8212; why counts and colData are two files</text>
    <text class="figSub" x="60" y="80">They come from two different downloads, have different shapes, and DESeq2 takes them as two arguments.</text>
  </g>

  <!-- SOURCE : counts download -->
  <g>
    <rect x="60" y="150" width="250" height="78" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text class="srcTitle mono" x="78" y="183">counts.tsv.gz</text>
    <text class="srcSub" x="78" y="205">NCBI reprocessed counts</text>
    <text class="srcSub" x="78" y="221">integer &#183; all 86 samples</text>
  </g>

  <!-- SOURCE : metadata download -->
  <g>
    <rect x="60" y="412" width="250" height="78" rx="12" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="2"/>
    <text class="srcTitle mono" x="78" y="445">series_matrix.txt.gz</text>
    <text class="srcSub" x="78" y="467">GEO GPL16791 (HiSeq)</text>
    <text class="srcSub" x="78" y="483">metadata &#183; 59 samples</text>
  </g>

  <!-- CONNECTORS source to file -->
  <g fill="none" stroke="#CBD3DA" stroke-width="3">
    <path d="M310,189 C 360,189 360,215 410,215"/>
    <path d="M310,451 C 360,451 360,425 410,425"/>
  </g>
  <g fill="#B7C0C8">
    <path d="M404,208 l14,7 l-14,7 z"/>
    <path d="M404,418 l14,7 l-14,7 z"/>
  </g>

  <!-- COUNTS FILE : genes x samples -->
  <g>
    <rect x="420" y="120" width="470" height="195" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="428" y="128" width="454" height="6" rx="3" fill="#4C57C4"/>
    <text class="boxTitle mono" x="448" y="165">counts.rds</text>
    <text class="boxSub" x="568" y="165">genes &#215; samples</text>
    <text class="cellLbl" x="868" y="165" text-anchor="end">large &#183; numeric &#183; frozen</text>
    <g class="mono">
      <text class="colHd" fill="#4C57C4" x="560" y="198" text-anchor="middle">S1</text>
      <text class="colHd" fill="#4C57C4" x="650" y="198" text-anchor="middle">S2</text>
      <text class="colHd" fill="#4C57C4" x="740" y="198" text-anchor="middle">S3</text>
      <text class="colHd" fill="#4C57C4" x="830" y="198" text-anchor="middle">S4</text>
      <text class="cellLbl" x="448" y="230">CXCL8</text>
      <text class="cellLbl" x="560" y="230" text-anchor="middle">42</text>
      <text class="cellLbl" x="650" y="230" text-anchor="middle">17</text>
      <text class="cellLbl" x="740" y="230" text-anchor="middle">88</text>
      <text class="cellLbl" x="830" y="230" text-anchor="middle">31</text>
      <text class="cellLbl" x="448" y="258">IL1B</text>
      <text class="cellLbl" x="560" y="258" text-anchor="middle">5</text>
      <text class="cellLbl" x="650" y="258" text-anchor="middle">120</text>
      <text class="cellLbl" x="740" y="258" text-anchor="middle">63</text>
      <text class="cellLbl" x="830" y="258" text-anchor="middle">9</text>
      <text class="cellLbl" x="448" y="286">FOS</text>
      <text class="cellLbl" x="560" y="286" text-anchor="middle">77</text>
      <text class="cellLbl" x="650" y="286" text-anchor="middle">24</text>
      <text class="cellLbl" x="740" y="286" text-anchor="middle">51</text>
      <text class="cellLbl" x="830" y="286" text-anchor="middle">40</text>
    </g>
  </g>

  <!-- COLDATA FILE : samples x covariates -->
  <g>
    <rect x="420" y="355" width="470" height="210" rx="16" fill="#FFFFFF" stroke="#DCE2E7" stroke-width="2"/>
    <rect x="428" y="363" width="454" height="6" rx="3" fill="#C9761B"/>
    <text class="boxTitle mono" x="448" y="400">coldata.rds</text>
    <text class="boxSub" x="578" y="400">samples &#215; covariates</text>
    <text class="cellLbl" x="868" y="400" text-anchor="end">small &#183; mixed &#183; often edited</text>
    <g class="mono">
      <text class="colHd" fill="#C9761B" x="470" y="432">sample</text>
      <text class="colHd" fill="#C9761B" x="600" y="432" text-anchor="middle">condition</text>
      <text class="colHd" fill="#C9761B" x="720" y="432" text-anchor="middle">sex</text>
      <text class="colHd" fill="#C9761B" x="820" y="432" text-anchor="middle">rin</text>
      <text class="cellLbl" x="470" y="460">S1</text>
      <text class="cellLbl" x="600" y="460" text-anchor="middle">CON</text>
      <text class="cellLbl" x="720" y="460" text-anchor="middle">M</text>
      <text class="cellLbl" x="820" y="460" text-anchor="middle">7.2</text>
      <text class="cellLbl" x="470" y="486">S2</text>
      <text class="cellLbl" x="600" y="486" text-anchor="middle">MDD</text>
      <text class="cellLbl" x="720" y="486" text-anchor="middle">F</text>
      <text class="cellLbl" x="820" y="486" text-anchor="middle">6.8</text>
      <text class="cellLbl" x="470" y="512">S3</text>
      <text class="cellLbl" x="600" y="512" text-anchor="middle">CON</text>
      <text class="cellLbl" x="720" y="512" text-anchor="middle">F</text>
      <text class="cellLbl" x="820" y="512" text-anchor="middle">8.1</text>
      <text class="cellLbl" x="470" y="538">S4</text>
      <text class="cellLbl" x="600" y="538" text-anchor="middle">MDD</text>
      <text class="cellLbl" x="720" y="538" text-anchor="middle">M</text>
      <text class="cellLbl" x="820" y="538" text-anchor="middle">7.5</text>
    </g>
  </g>

  <!-- ALIGN KEY : matched + reordered by sample ID -->
  <g>
    <path d="M945,215 C 1000,215 1000,335 1040,335" fill="none" stroke="#E4A24A" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M945,455 C 1000,455 1000,335 1040,335" fill="none" stroke="#E4A24A" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="915" y="312" width="52" height="24" rx="6" fill="#FDF4E3" stroke="#E4A24A" stroke-width="1.5"/>
    <text class="join mono" x="941" y="329" text-anchor="middle">S1&#8230;S4</text>
    <text class="join" x="1055" y="312">aligned by</text>
    <text class="join" x="1055" y="332">sample ID</text>
    <text class="join mono" x="1055" y="356" font-size="11">counts[, rownames(coldata)]</text>
  </g>

  <!-- REJOIN CAPTION : DESeq2 -->
  <g>
    <rect x="420" y="588" width="620" height="34" rx="8" fill="#F3F5F7" stroke="#DCE2E7" stroke-width="1.5"/>
    <text class="code" x="440" y="611">&#8594; DESeqDataSetFromMatrix(countData=, colData=)</text>
  </g>
</svg>
